<h1>Neyora Account Deletion</h1>

<p>You can delete your Neyora account directly inside the app:</p>

<p><strong>Profile / Settings → Delete Account</strong></p>

<p>This will delete your account and associated personal data.</p>

<p>If you cannot access the app, you can contact us at:</p>

<p><a href="mailto:support@neyora.app">support@neyora.app</a></p>
